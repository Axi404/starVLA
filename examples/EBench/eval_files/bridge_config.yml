# Bridge config: connects StarVLA policy server to an EBench evaluation server.
# The bridge is a client to both sides; there is no benchmark driver to hand this file to,
# bridge.py loads it directly.

# ---- StarVLA policy server (same machine by default) ----
policy_host: "127.0.0.1"
policy_port: 5694
policy_ckpt_path: "results/Checkpoints/QwenOFT-all-200k-50chunk-ebench-512-over-2B-state/checkpoints/steps_200000_pytorch_model.pt"
unnorm_key: "new_embodiment"

# ---- EBench evaluation server ----
ebench_base_url: "http://127.0.0.1:8087"
ebench_worker_id: "0"
ebench_run_id: "starvla_ebench"
# Save client-side intermediate process artifacts through genmanip_client.
save_process: true
save_result: true

# ---- cameras ----
# Order here is fed positionally into StarVLA, matching EBenchConfig.video_keys
# in examples/EBench/train_files/data_registry/data_config.py:
#   slot 0 (prim/overhead): training key depends on the ckpt family
#                             *-over*  → video.cam_over       (overlook camera)
#                             older    → video.cam_high       (top_camera)
#   slot 1 (left wrist):    video.cam_left_wrist   ← video.left_camera_view
#   slot 2 (right wrist):   video.cam_right_wrist  ← video.right_camera_view
# Keep prim views before wrist views (see _assert_camera_order_matches_training).
camera_keys:
  - "video.overlook_camera_view"  # for older -128 ckpt swap to video.top_camera_view
  - "video.left_camera_view"
  - "video.right_camera_view"

# ---- state layout ----
# Set false for checkpoints trained without datasets.vla_data.include_state.
# When true, bridge.py packs raw EBench obs into the training state order:
# [state.left_joints, state.right_joints, state.left_gripper, state.right_gripper, state.base].
# The policy server normalizes this raw state with the checkpoint's training transform.
include_state: true
state_order:
  - "left_joints"
  - "right_joints"
  - "left_gripper"
  - "right_gripper"
  - "base"
state_layout:
  left_joints:   {key: "state.joints",  slice: [0, 6]}
  right_joints:  {key: "state.joints",  slice: [6, 12]}
  left_gripper:  {key: "state.gripper", slice: [0, 2]}
  right_gripper: {key: "state.gripper", slice: [2, 4]}
  base:          {key: "state.base",    slice: [0, 3]}

# ---- action layout ----
# Slices inside the model's (action_dim=19) output, following EBenchConfig action_keys order.
action_layout:
  left_joints:  [0, 6]      # 6 dims
  right_joints: [6, 12]     # 6 dims
  left_gripper: [12, 14]    # 2 dims
  right_gripper: [14, 16]   # 2 dims
  base_delta:   [16, 19]    # 3 dims (dx, dy, dyaw)

# ---- EBench action dict fields ----
control_type: "joint_position"   # "joint_position" or "ee_pose"; we train on joint positions
is_rel: false                    # false = arm action is absolute joint target

# ---- chunk mode ----
# Two independent knobs:
#   chunk_mode             — HTTP route. true → one /step_chunk call advances
#                            N sim steps; false → N separate /step calls (one
#                            obs + one client recording per sim step).
#   actions_per_inference  — how many predicted actions to consume before
#                            re-inferring. null = natural default (full chunk
#                            in chunk_mode, 1 otherwise). Set 50 with
#                            chunk_mode=false for open-loop 50-step rollout
#                            of one chunk over 50 separate /step calls.
chunk_mode: false
actions_per_inference: 50
max_chunk_len: null  # cap chunk_mode chunk length; null = whatever the model predicts

# ---- misc ----
image_size: [224, 224]
max_steps: null        # null = run until EBench says done; set e.g. 3 to smoke-test
log_every: 10          # print a step log every N inference calls
debug: true            # on step 1, dump full obs/example/chunk/payload structures
